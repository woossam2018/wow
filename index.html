<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인스타 카드뉴스 1분 자동화기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

  <div class="w-full max-w-lg space-y-5">
    <!-- 헤더 -->
    <header class="text-center">
      <h1 class="text-2xl font-black text-white tracking-tight">인스타 카드뉴스 AI 자동화기</h1>
      <p class="text-xs text-slate-400 mt-1">기사 내용 복붙 ➔ 바이럴 훅 선정 ➔ 카드뉴스 1분 완성</p>
    </header>

    <!-- API 키 설정 (로컬스토리지에 안전 저장) -->
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
      <label class="text-[11px] font-bold text-slate-400 block mb-1">OpenAI API Key 설정</label>
      <div class="flex gap-2">
        <input type="password" id="apiKeyInput" placeholder="sk-..." class="flex-1 bg-slate-950 border border-slate-800 px-3 py-1.5 text-xs rounded-xl focus:outline-none focus:ring-1 focus:ring-blue-500" />
        <button onclick="saveApiKey()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-xl font-semibold">저장</button>
      </div>
      <p id="keyStatus" class="text-[10px] text-emerald-400 mt-1 hidden">✅ API 키가 브라우저에 저장되어 있습니다.</p>
    </div>

    <!-- 기사 본문 입력 영역 -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <label class="text-xs font-bold text-slate-300 block">기사 내용 붙여넣기</label>
      <textarea id="articleText" rows="4" placeholder="네이버 뉴스 등 기사 본문 내용을 복사해서 여기에 붙여넣으세요..." class="w-full bg-slate-950 border border-slate-800 p-3 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      
      <button id="generateBtn" onclick="startGeneration()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 text-sm rounded-xl transition shadow">
        ⚡ 1분 만에 카드뉴스 만들기
      </button>
    </div>

    <!-- 로딩 표시기 -->
    <div id="loading" class="hidden text-center py-8 space-y-2">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
      <p class="text-xs text-slate-400" id="loadingText">AI가 바이럴 카피와 이미지를 제작 중입니다 (약 20~30초)...</p>
    </div>

    <!-- 결과 영역 (생성 완료 시 표시) -->
    <div id="resultArea" class="hidden space-y-5">
      <!-- 캔버스 에디터 -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col items-center shadow-xl">
        <canvas id="cardCanvas" class="w-full max-w-sm aspect-square rounded-xl bg-black shadow-2xl"></canvas>

        <!-- 편집 컨트롤러 -->
        <div class="w-full mt-4 grid grid-cols-2 gap-3 text-xs">
          <div>
            <label class="text-slate-400">글자 크기 (<span id="fontSizeVal">52</span>px)</label>
            <input type="range" id="fontSizeSlider" min="32" max="72" value="52" class="w-full mt-1 accent-blue-500" oninput="updateCanvas()" />
          </div>
          <div>
            <label class="text-slate-400">텍스트 위치 (Y축)</label>
            <input type="range" id="yPosSlider" min="450" max="880" value="720" class="w-full mt-1 accent-blue-500" oninput="updateCanvas()" />
          </div>
        </div>

        <input type="text" id="customTitleInput" class="w-full mt-3 bg-slate-950 border border-slate-800 px-3 py-2 text-xs rounded-xl" oninput="updateCanvas()" />

        <button onclick="downloadImage()" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm shadow">
          📸 완성된 카드뉴스 사진 저장
        </button>
      </div>

      <!-- 바이럴 훅 제목 5종 선택기 -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
        <h2 class="text-xs font-bold text-slate-400">AI 추천 훅 타이틀 5개</h2>
        <div id="titlesList" class="flex flex-col gap-2"></div>
      </div>

      <!-- 인스타 본문 캡션 & 복사 -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex gap-1 bg-slate-950 p-1 rounded-lg text-xs">
            <button onclick="switchTab('sympathetic')" id="tab-sympathetic" class="px-2.5 py-1 rounded-md bg-slate-800 text-white font-bold">공감형</button>
            <button onclick="switchTab('poll')" id="tab-poll" class="px-2.5 py-1 rounded-md text-slate-400">투표형</button>
            <button onclick="switchTab('informative')" id="tab-informative" class="px-2.5 py-1 rounded-md text-slate-400">설명형</button>
          </div>
          <button onclick="copyCaption()" id="copyBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">
            본문 복사
          </button>
        </div>
        <textarea id="captionText" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 p-3 text-xs rounded-xl text-slate-300 leading-relaxed resize-none focus:outline-none"></textarea>
      </div>
    </div>
  </div>

  <script>
    // 전역 상태
    let appData = null;
    let bgImage = new Image();
    let currentTab = 'sympathetic';

    // 1. API 키 초기화
    window.onload = () => {
      const savedKey = localStorage.getItem('openai_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('keyStatus').classList.remove('hidden');
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return alert('API 키를 입력해주세요.');
      localStorage.setItem('openai_api_key', key);
      document.getElementById('keyStatus').classList.remove('hidden');
      alert('API 키가 안전하게 저장되었습니다.');
    }

    // 2. 카드뉴스 자동 생성 메인 로직
    async function startGeneration() {
      const apiKey = localStorage.getItem('openai_api_key');
      if (!apiKey) return alert('먼저 상단에 OpenAI API 키를 저장해주세요.');

      const article = document.getElementById('articleText').value.trim();
      if (!article) return alert('기사 내용을 입력해주세요.');

      const loading = document.getElementById('loading');
      const resultArea = document.getElementById('resultArea');
      const generateBtn = document.getElementById('generateBtn');

      loading.classList.remove('hidden');
      resultArea.classList.add('hidden');
      generateBtn.disabled = true;

      try {
        // [1단계] GPT-4o로 카피 5종 + 본문 + 이미지 프롬프트 생성
        const gptRes = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            response_format: { type: "json_object" },
            messages: [
              {
                role: "system",
                content: `인스타그램 카드뉴스 100만 뷰 마케터입니다. 기사를 읽고 아래 JSON으로만 응답하세요:
{
  "titles": ["호기심 자극 제목 1", "감정/공감 질문 제목 2", "충격/숫자 제목 3", "스토리형 제목 4", "핵심 요약 제목 5"],
  "image_prompt": "DALL-E 3용 영문 프롬프트. 기사의 핵심 분위기를 사실적이고 감각적인 보도사진 스타일로 묘사. 글자나 텍스트는 절대 포함하지 말 것 (No text, no letters)",
  "captions": {
    "informative": "사건의 맥락을 요약한 설명형 캡션 + #해시태그",
    "sympathetic": "독자의 감정에 공감하는 캡션 + #해시태그",
    "poll": "독자들의 찬반 투표를 부르는 질문형 캡션 + #해시태그"
  }
}`
              },
              { role: "user", content: `기사 내용:\n${article.slice(0, 2500)}` }
            ]
          })
        });

        const gptData = await gptRes.json();
        if (gptData.error) throw new Error(gptData.error.message);
        const parsed = JSON.parse(gptData.choices[0].message.content);

        // [2단계] DALL-E 3로 고화질 배경 이미지 생성 (Base64 형식)
        const imgRes = await fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "dall-e-3",
            prompt: `${parsed.image_prompt}, photorealistic, editorial photography, 8k, cinematic, no text`,
            n: 1,
            size: "1024x1024",
            response_format: "b64_json"
          })
        });

        const imgData = await imgRes.json();
        if (imgData.error) throw new Error(imgData.error.message);

        appData = {
          titles: parsed.titles,
          captions: parsed.captions,
          imageDataUrl: `data:image/png;base64,${imgData.data[0].b64_json}`
        };

        // 데이터 화면 반영
        setupUI();
        resultArea.classList.remove('hidden');
      } catch (err) {
        alert('생성 실패: ' + err.message);
      } finally {
        loading.classList.add('hidden');
        generateBtn.disabled = false;
      }
    }

    // 3. UI 셋업
    function setupUI() {
      document.getElementById('customTitleInput').value = appData.titles[0];

      // 타이틀 목록 생성
      const list = document.getElementById('titlesList');
      list.innerHTML = '';
      appData.titles.forEach((title, i) => {
        const btn = document.createElement('button');
        btn.className = 'text-left text-xs p-2.5 rounded-xl border border-slate-800 bg-slate-950/70 text-slate-300 hover:bg-slate-800 transition';
        btn.innerText = `${i + 1}. ${title}`;
        btn.onclick = () => {
          document.getElementById('customTitleInput').value = title;
          updateCanvas();
        };
        list.appendChild(btn);
      });

      switchTab('sympathetic');

      bgImage.src = appData.imageDataUrl;
      bgImage.onload = () => updateCanvas();
    }

    // 4. 캔버스 렌더링
    function updateCanvas() {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      const title = document.getElementById('customTitleInput').value;
      const fontSize = parseInt(document.getElementById('fontSizeSlider').value);
      const yPos = parseInt(document.getElementById('yPosSlider').value);
      document.getElementById('fontSizeVal').innerText = fontSize;

      canvas.width = 1024;
      canvas.height = 1024;

      // 배경 이미지
      ctx.drawImage(bgImage, 0, 0, 1024, 1024);

      // 하단 그라데이션 오버레이
      const grad = ctx.createLinearGradient(0, 450, 0, 1024);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.4, 'rgba(0,0,0,0.5)');
      grad.addColorStop(1, 'rgba(0,0,0,0.88)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // 텍스트 스타일
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      // 자동 줄바꿈
      const maxWidth = 860;
      const words = title.split(' ');
      let line = '';
      const lines = [];

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const lineHeight = fontSize * 1.35;
      lines.forEach((l, idx) => {
        ctx.fillText(l.trim(), 512, yPos + idx * lineHeight);
      });
    }

    // 5. 탭 전환 & 복사
    function switchTab(tab) {
      currentTab = tab;
      ['sympathetic', 'poll', 'informative'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'px-2.5 py-1 rounded-md bg-slate-800 text-white font-bold';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md text-slate-400 hover:text-white';
        }
      });
      document.getElementById('captionText').value = appData.captions[tab];
    }

    function copyCaption() {
      const text = document.getElementById('captionText').value;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      btn.innerText = '✅ 복사 완료!';
      setTimeout(() => btn.innerText = '본문 복사', 2000);
    }

    // 6. 이미지 다운로드
    function downloadImage() {
      const canvas = document.getElementById('cardCanvas');
      const link = document.createElement('a');
      link.download = `cardnews-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
