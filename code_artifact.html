<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개구리 징검다리 건너기</title>
    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti (폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (아이들 친화적인 둥근 폰트) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0fdf4; /* 아주 연한 파스텔 초록 배경 */
            touch-action: manipulation; /* 모바일 더블탭 확대 방지 */
        }

        /* 연못 배경 그라데이션 */
        .pond-bg {
            background: linear-gradient(180deg, #bae6fd 0%, #7dd3fc 100%);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.05);
        }

        /* 징검다리 입체감 */
        .stone {
            background-color: #4ade80;
            box-shadow: 0 8px 0 #16a34a, 0 15px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .stone-question {
            background-color: #ffffff;
            border: 4px dashed #4ade80;
            box-shadow: 0 8px 0 #d1d5db;
        }

        /* 개구리 점프 애니메이션 */
        .jump-anim {
            animation: jump 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes jump {
            0% { transform: translateY(0) scale(1) translateX(-50%); }
            50% { transform: translateY(-80px) scale(1.15) translateX(-45%); }
            100% { transform: translateY(0) scale(1) translateX(-50%); }
        }

        /* 오답 시 흔들림 애니메이션 */
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* 개굴! 말풍선 애니메이션 */
        .ribbit-bubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 20px;
            color: #16a34a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }
        .ribbit-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
        .show-ribbit {
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            20% { transform: translate(-50%, -10px) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -20px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
        }

        /* 버튼 호버 액션 */
        .btn-choice {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-choice:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2563eb !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- 헤더 / 난이도 선택 -->
    <div class="w-full max-w-4xl text-center mb-6 z-10 relative">
        <h1 class="text-4xl md:text-5xl text-green-600 mb-6 drop-shadow-sm">🐸 개구리 징검다리 건너기 🐸</h1>
        <p class="text-xl text-gray-600 mb-4" id="instruction-text">어떤 숫자로 뛰어세기를 해볼까요?</p>
        <div class="flex flex-wrap justify-center gap-2 md:gap-3" id="difficulty-buttons">
            <!-- 자바스크립트로 버튼 생성 -->
        </div>
    </div>

    <!-- 메인 게임 영역 (연못) -->
    <div class="relative w-full max-w-4xl h-64 md:h-80 pond-bg rounded-[3rem] overflow-hidden border-8 border-blue-200 shadow-xl mb-8 flex-shrink-0">
        
        <!-- 물결 장식 -->
        <div class="absolute top-10 left-10 w-20 h-4 border-b-4 border-blue-300 rounded-[50%] opacity-50"></div>
        <div class="absolute top-32 right-20 w-32 h-4 border-b-4 border-blue-300 rounded-[50%] opacity-50"></div>

        <!-- 징검다리 트랙 (이동하는 배경) -->
        <div id="track" class="absolute h-full flex items-center transition-transform duration-500 ease-in-out" style="left: 50%; transform: translateX(0);">
            <!-- 출발지 (풀밭) -->
            <div class="w-40 h-full bg-green-500 rounded-r-[4rem] border-r-8 border-green-600 flex-shrink-0 flex items-center justify-end pr-8">
                <span class="text-3xl text-green-100">출발!</span>
            </div>
            
            <!-- 징검다리가 동적으로 추가될 공간 -->
            <div id="stones-container" class="flex items-center gap-8 px-8"></div>
            
            <!-- 도착지 (풀밭) -->
            <div id="finish-line" class="w-40 h-full bg-green-500 rounded-l-[4rem] border-l-8 border-green-600 flex-shrink-0 flex items-center justify-start pl-8 hidden">
                <span class="text-3xl text-yellow-300">도착! 🎉</span>
            </div>
        </div>

        <!-- 중앙에 고정된 개구리 -->
        <div id="frog" class="absolute bottom-16 md:bottom-24 text-[5rem] md:text-[6rem] z-10 origin-bottom" style="left: 50%; transform: translateX(-50%);">
            🐸
            <div id="ribbit-text" class="ribbit-bubble">개굴!</div>
        </div>
    </div>

    <!-- 하단 컨트롤 영역 -->
    <div class="w-full max-w-2xl text-center pb-10">
        <div id="game-controls" class="hidden">
            <h2 id="question-text" class="text-2xl md:text-3xl text-gray-700 mb-6 bg-white py-3 px-6 rounded-full shadow-sm inline-block border-2 border-green-200">
                다음 징검다리에 들어갈 숫자는?
            </h2>
            <div id="choices" class="flex justify-center gap-4 md:gap-8">
                <!-- 선택지 버튼 -->
            </div>
        </div>

        <!-- 게임 완료 후 다시 시작 영역 -->
        <div id="result-controls" class="hidden">
            <h2 class="text-3xl text-green-600 mb-6 animate-bounce">대단해요! 징검다리를 모두 건넜어요! 🎉</h2>
            <button onclick="resetGame()" class="text-2xl bg-yellow-400 hover:bg-yellow-300 text-yellow-900 py-4 px-10 rounded-full shadow-[0_6px_0_#ca8a04] active:shadow-[0_0px_0_#ca8a04] active:translate-y-[6px] transition-all border-4 border-yellow-200 font-bold">
                다른 숫자로 또 하기
            </button>
        </div>
    </div>

    <script>
        // 게임 상태 변수
        let currentMultiplier = 0;
        let currentStep = 0; // 0: 출발지, 1~10: 징검다리
        const totalSteps = 10;
        const stoneWidth = 100; // 징검다리 너비 추정치 (px)
        const stoneGap = 32;    // gap-8 은 32px
        const trackStepDistance = stoneWidth + stoneGap; // 이동 거리
        let isAnimating = false;

        // DOM 요소
        const difficultyButtons = document.getElementById('difficulty-buttons');
        const track = document.getElementById('track');
        const stonesContainer = document.getElementById('stones-container');
        const frog = document.getElementById('frog');
        const ribbitText = document.getElementById('ribbit-text');
        const gameControls = document.getElementById('game-controls');
        const choicesDiv = document.getElementById('choices');
        const resultControls = document.getElementById('result-controls');
        const finishLine = document.getElementById('finish-line');
        const instructionText = document.getElementById('instruction-text');
        const questionText = document.getElementById('question-text');

        // 1. 초기화: 난이도 버튼 생성
        function init() {
            for (let i = 2; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'bg-white hover:bg-green-100 text-green-600 text-2xl font-bold py-2 px-6 rounded-full border-4 border-green-300 shadow-[0_4px_0_#86efac] active:translate-y-1 active:shadow-none transition-all';
                btn.innerText = `${i}씩 뛰기`;
                btn.onclick = () => startGame(i);
                difficultyButtons.appendChild(btn);
            }
        }

        // 2. 게임 시작
        function startGame(multiplier) {
            currentMultiplier = multiplier;
            currentStep = 1;
            isAnimating = false;

            // UI 변경
            difficultyButtons.classList.add('hidden');
            instructionText.innerHTML = `<span class="text-green-600 font-bold text-2xl">${multiplier}씩 뛰어세기</span>를 시작합니다!`;
            gameControls.classList.remove('hidden');
            resultControls.classList.add('hidden');
            finishLine.classList.remove('hidden');

            // 징검다리 생성
            createStones();
            
            // 위치 업데이트 및 첫 문제 출제
            updateVisuals();
            generateChoices();
        }

        // 징검다리 DOM 요소 생성
        function createStones() {
            stonesContainer.innerHTML = '';
            for (let i = 1; i <= totalSteps; i++) {
                const stone = document.createElement('div');
                stone.id = `stone-${i}`;
                stone.className = 'stone flex-shrink-0 w-[100px] h-[100px] md:w-[120px] md:h-[120px] rounded-full flex items-center justify-center text-4xl md:text-5xl text-white font-bold relative';
                
                // 첫 징검다리 표시
                if (i === 1) {
                    stone.innerText = currentMultiplier * 1;
                } else if (i === 2) {
                    stone.classList.add('stone-question');
                    stone.classList.remove('stone');
                    stone.innerHTML = '<span class="text-green-400">?</span>';
                }
                
                stonesContainer.appendChild(stone);
            }
        }

        // 트랙 이동 및 징검다리 상태 업데이트
        function updateVisuals() {
            // 출발지(너비 160px) + 패딩(32px) = 192px을 첫 번째 돌의 중심으로 맞추기 위한 기본 오프셋
            const baseOffset = -192; 
            // 현재 스텝에 맞게 트랙 이동 (반응형 대응을 위해 백분율과 픽셀 혼합)
            // 첫 번째 돌의 넓이는 100~120px 가변이므로 대략적인 이동값을 설정
            const offset = baseOffset - ((currentStep - 1) * 132); // 132px 단위로 이동
            
            track.style.transform = `translateX(${offset}px)`;

            // 돌 텍스트 및 스타일 업데이트
            for (let i = 1; i <= totalSteps; i++) {
                const stone = document.getElementById(`stone-${i}`);
                if (!stone) continue;

                if (i <= currentStep) {
                    // 이미 지나왔거나 현재 있는 돌
                    stone.className = 'stone flex-shrink-0 w-[100px] h-[100px] md:w-[120px] md:h-[120px] rounded-full flex items-center justify-center text-4xl md:text-5xl text-white font-bold';
                    stone.innerText = currentMultiplier * i;
                } else if (i === currentStep + 1) {
                    // 다음 목표 돌 (물음표)
                    stone.className = 'stone-question flex-shrink-0 w-[100px] h-[100px] md:w-[120px] md:h-[120px] rounded-full flex items-center justify-center text-5xl md:text-6xl text-green-500 font-bold';
                    stone.innerText = '?';
                }
            }
        }

        // 3. 문제(선택지) 출제
        function generateChoices() {
            choicesDiv.innerHTML = '';
            
            // 게임 끝 체크
            if (currentStep >= totalSteps) {
                gameComplete();
                return;
            }

            const nextStep = currentStep + 1;
            const targetAnswer = currentMultiplier * nextStep;
            
            // 오답 생성 로직 (근처 숫자들)
            let options = new Set([targetAnswer]);
            while (options.size < 3) {
                // 정답 기준 -2 ~ +2 범위의 오답 생성
                let diff = Math.floor(Math.random() * 5) - 2; 
                let fake = targetAnswer + (diff * currentMultiplier > 0 ? diff * currentMultiplier : diff);
                // 0 이하거나 이미 있는 숫자면 무시
                if (fake > 0 && !options.has(fake)) {
                    options.add(fake);
                }
            }

            // 보기 섞기
            const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

            // 버튼 렌더링
            shuffled.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'btn-choice bg-blue-500 hover:bg-blue-400 text-white text-3xl md:text-4xl font-bold w-24 h-24 md:w-28 md:h-28 rounded-full shadow-[0_8px_0_#1d4ed8] border-4 border-blue-300 flex items-center justify-center';
                btn.innerText = num;
                btn.onclick = () => handleChoice(num, targetAnswer, btn);
                choicesDiv.appendChild(btn);
            });
        }

        // 4. 사용자 선택 처리
        function handleChoice(selectedVal, targetVal, btnElement) {
            if (isAnimating) return;

            if (selectedVal === targetVal) {
                // 정답 처리
                isAnimating = true;
                currentStep++;
                
                // 정답 효과
                frog.classList.add('jump-anim');
                ribbitText.classList.add('show-ribbit');
                
                setTimeout(() => {
                    updateVisuals();
                }, 250); // 점프 중간 지점에서 배경 이동 시작

                setTimeout(() => {
                    frog.classList.remove('jump-anim');
                    ribbitText.classList.remove('show-ribbit');
                    isAnimating = false;
                    generateChoices();
                }, 600); // 애니메이션 끝난 후 상태 갱신

            } else {
                // 오답 처리
                btnElement.classList.add('bg-red-400', 'shadow-[0_8px_0_#b91c1c]');
                btnElement.classList.remove('bg-blue-500', 'shadow-[0_8px_0_#1d4ed8]');
                btnElement.classList.add('shake-anim');
                
                // 물음표 돌도 함께 흔들기
                const targetStone = document.getElementById(`stone-${currentStep + 1}`);
                if (targetStone) {
                    targetStone.classList.add('shake-anim');
                }

                setTimeout(() => {
                    btnElement.classList.remove('shake-anim', 'bg-red-400', 'shadow-[0_8px_0_#b91c1c]');
                    btnElement.classList.add('bg-blue-500', 'shadow-[0_8px_0_#1d4ed8]');
                    if (targetStone) targetStone.classList.remove('shake-anim');
                }, 400);
            }
        }

        // 5. 게임 클리어 연출
        function gameComplete() {
            gameControls.classList.add('hidden');
            resultControls.classList.remove('hidden');
            
            // 폭죽 효과 (연속 터짐)
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // 마지막 개구리 만세 점프
            frog.style.transform = 'translateX(-50%) translateY(-20px) scale(1.2)';
            setTimeout(() => {
                frog.style.transform = 'translateX(-50%)';
            }, 500);
        }

        // 다시 하기
        function resetGame() {
            difficultyButtons.classList.remove('hidden');
            resultControls.classList.add('hidden');
            finishLine.classList.add('hidden');
            instructionText.innerHTML = "어떤 숫자로 뛰어세기를 해볼까요?";
            track.style.transform = 'translateX(0px)'; // 출발지로 원복
            stonesContainer.innerHTML = '';
        }

        // 페이지 로드 시 초기화 실행
        window.onload = init;
    </script>
</body>
</html>
